<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Login</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="img/logo.png" alt="TechStore Logo" width="150">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="login.html" class="ativo">Login</a></li>
                <li><a href="quem-somos.html">Quem Somos</a></li>
            </ul>
        </nav>
    </header>

    <main class="conteudo-principal">
        <section class="form-container form-login-box">
            <h2>Acesse a sua Conta</h2>
            <p>Entre com os seus dados de acesso para gerir os seus pedidos.</p>

            <form action="#" method="POST" class="form-login">
                
                <div class="campo">
                    <label for="email_login">E-mail de Acesso:</label>
                    <input type="email" id="email_login" name="email_login" placeholder="seuemail@exemplo.com" required autocomplete="email">
                </div>

                <div class="campo">
                    <label for="senha_login">Senha:</label>
                    <input type="password" id="senha_login" name="senha_login" placeholder="Digite a sua senha" required autocomplete="current-password">
                </div>

                <div class="opcoes-login">
                    <div class="campo-checkbox">
                        <input type="checkbox" id="lembrar" name="lembrar">
                        <label for="lembrar">Lembrar de mim</label>
                    </div>
                    <a href="#" class="link-esqueci">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-enviar">Entrar</button>
            </form>

            <p class="link-redirecionamento">
                Ainda não tem conta na TechStore? <a href="cadastro.html">Registe-se agora</a>.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechStore - Equipamentos Audiovisuais. Todos os direitos reservados.</p>
    </footer>

    <a href="#" class="btn-topo" id="btnTopo" aria-label="Voltar ao topo"><span>&#8593;</span></a>
    <script>
        const btnTopo = document.getElementById("btnTopo");
        window.addEventListener("scroll", () => {
            btnTopo.classList.toggle("visivel", window.scrollY > 300);
        });
    </script>

</body>
</html>
